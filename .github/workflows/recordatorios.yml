name: Send Email Notification

on:
  workflow_dispatch:
    inputs:
      notification_type:
        description: 'Tipo de notificación'
        required: true
        default: 'reminder'
        type: choice
        options:
          - reminder       # recordatorio de la próxima sesión programada
          - announcement   # aviso ("nueva sesión") de la próxima sesión programada
      test:
        description: 'Modo prueba: enviar solo a la cuenta del grupo'
        required: false
        default: false
        type: boolean
  schedule:
    # 01:47 UTC = 03:47 en Madrid en verano, 02:47 en invierno.
    # GitHub ejecuta los crons con retraso variable: en julio de 2026 entre 2 y
    # 3 horas; en octubre de 2026 entre 5 y 6 horas. Con esta hora, incluso con
    # 6 horas de retraso el recordatorio llega antes de las 10:00 hora de Madrid
    # en cualquier época del año. El minuto 47 evita la hora en punto, que es
    # la más congestionada. El fichero se llamaba send-notification.yml hasta
    # el 02/10/2026.
    - cron: '47 1 * * *'

permissions:
  contents: write   # necesario para el commit de keepalive

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # GitHub desactiva los workflows con "schedule" en repositorios públicos
      # tras 60 días sin commits. Si el último commit tiene más de 50 días,
      # este paso hace un commit vacío para reiniciar ese contador. Los commits
      # hechos con GITHUB_TOKEN no disparan otros workflows, así que no se
      # regenera la web ni se envía ningún correo por ello.
      - name: Mantener activo el cron (keepalive)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Último commit hace $days días."
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive para que GitHub no desactive el cron de recordatorios"
            git push
            echo "Commit de keepalive enviado."
          fi

      - name: Send email notification
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GENTE_PASSPHRASE: ${{ secrets.GENTE_PASSPHRASE }}
          RECIPIENTS_FILE: content/TheComputationalGarage/gente
          NOTIFICATION_TYPE: ${{ inputs.notification_type }}
          TEST_MODE: ${{ inputs.test }}
        run: |
          EXTRA=""
          if [ "$TEST_MODE" = "true" ]; then EXTRA="--test"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/tcg_mail.py remind --if-tomorrow
          elif [ "$NOTIFICATION_TYPE" = "announcement" ]; then
            python3 scripts/tcg_mail.py announce --force $EXTRA
          else
            python3 scripts/tcg_mail.py remind $EXTRA
          fi
