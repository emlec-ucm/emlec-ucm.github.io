name: Enviar mensaje a participantes

# Envía por correo a los participantes de The Computational Garage el
# contenido de un issue creado con la plantilla "Mensaje a los participantes".
#
# Flujo:
#   1. Se crea el issue con la plantilla (queda con la etiqueta "mensaje").
#      Crear el issue NO envía nada.
#   2. Se añade la etiqueta "prueba"  -> se envía solo a la cuenta del grupo.
#      Se añade la etiqueta "enviar"  -> se envía a todos los participantes
#                                        y el issue se cierra.
#
# Autorización: en un repositorio público cualquiera puede abrir issues, pero
# solo quien tiene permisos (triage o superior) puede poner etiquetas. Además
# el paso "Comprobar condiciones" verifica vía API el permiso de quien puso la
# etiqueta, y consulta el estado y las etiquetas del issue en ese momento (el
# payload del evento puede llegar incompleto cuando las etiquetas se ponen al
# crear el issue).

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: mensaje-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  send:
    if: github.event.label.name == 'enviar' || github.event.label.name == 'prueba'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      LABEL: ${{ github.event.label.name }}
      SENDER: ${{ github.event.sender.login }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Comprobar condiciones
        id: check
        run: |
          INFO=$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER" --jq '"\(.state)|\(.author_association)|\([.labels[].name] | join(","))"')
          STATE=${INFO%%|*}; REST=${INFO#*|}; ASSOC=${REST%%|*}; LABELS=${REST#*|}
          ROLE=$(gh api "repos/$GH_REPO/collaborators/$SENDER/permission" --jq '.role_name' 2>/dev/null || echo "none")
          echo "Issue #$ISSUE_NUMBER: estado=$STATE etiquetas=[$LABELS] autor=$ASSOC | etiqueta '$LABEL' puesta por $SENDER (permiso: $ROLE)"
          if [ "$STATE" != "open" ]; then
            echo "::error::El issue #$ISSUE_NUMBER está cerrado. Reábrelo y vuelve a poner la etiqueta '$LABEL'."; exit 1
          fi
          case ",$LABELS," in
            *,mensaje,*) ;;
            *) echo "::error::El issue #$ISSUE_NUMBER no tiene la etiqueta 'mensaje'. Solo se envían los issues creados con la plantilla 'Mensaje a los participantes'."; exit 1 ;;
          esac
          case "$ROLE" in
            admin|maintain|write|triage) ;;
            *) echo "::error::$SENDER no tiene permisos en el repositorio para enviar mensajes (permiso: $ROLE)."; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enviar el correo
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GENTE_PASSPHRASE: ${{ secrets.GENTE_PASSPHRASE }}
          RECIPIENTS_FILE: content/TheComputationalGarage/gente
          # Título y cuerpo del issue se pasan por variables de entorno (nunca
          # interpolados en el script) para evitar inyección de comandos.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          EXTRA=""
          if [ "$LABEL" = "prueba" ]; then EXTRA="--test"; fi
          python3 scripts/tcg_mail.py message --from-issue $EXTRA

      - name: Anotar el resultado en el issue
        if: success()
        run: |
          FECHA=$(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')
          if [ "$LABEL" = "prueba" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "✅ **Prueba enviada** ($FECHA) solo a la cuenta de correo del grupo. Revísala y, si está bien, añade la etiqueta **enviar** para mandarla a todos los participantes. Si quieres cambiar algo, edita el issue y vuelve a poner **prueba**. ([log]($RUN_URL))"
            gh issue edit "$ISSUE_NUMBER" --remove-label prueba
          else
            gh issue comment "$ISSUE_NUMBER" --body "✅ **Mensaje enviado a los participantes** ($FECHA). ([log]($RUN_URL))"
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

      - name: Avisar del fallo en el issue
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ **No se pudo enviar el mensaje** (etiqueta \`$LABEL\`). Revisa el [log de la ejecución]($RUN_URL): el motivo aparece en rojo. Corrige lo necesario y vuelve a añadir la etiqueta **$LABEL** para reintentar." || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "$LABEL" || true
