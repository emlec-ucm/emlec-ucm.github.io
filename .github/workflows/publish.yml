name: Push Web Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          # Historial completo: hace falta para comparar sesiones.org con el
          # commit anterior al push (github.event.before) y detectar sesiones nuevas.
          fetch-depth: 0

      - name: Instala Emacs y ejecuta publish.el
        run: |
          sudo apt-get update
          sudo apt-get install emacs -y
          emacs --batch --eval "(require 'package)" \
                --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\"))" \
                --eval "(package-initialize)" \
                --eval "(package-refresh-contents)" \
                --eval "(package-install 'htmlize)"
          emacs --batch -l publish.el
          ls docs/*

      - name: Deploy docs/ a gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          destination_dir: docs

      # Compara sesiones.org con el estado anterior al push y envía un aviso
      # por cada sesión nueva con fecha futura. Si no hay ninguna, no hace nada.
      - name: Enviar aviso de sesiones nuevas
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GENTE_PASSPHRASE: ${{ secrets.GENTE_PASSPHRASE }}
          RECIPIENTS_FILE: content/TheComputationalGarage/gente
        run: python3 scripts/tcg_mail.py announce --base "${{ github.event.before }}"
